[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-agent-databricks"
version = "0.1.0"
description = "RAG Agent on Databricks/Spark/dbt documentation using Claude + pgvector"
requires-python = ">=3.9"

dependencies = [
    # LLM
    "anthropic>=0.40.0",
    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    # Embeddings
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
    # Vector store
    "langchain-postgres>=0.0.9",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
    # Ingestion
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Evaluation
    "ragas>=0.2.0",
    "langfuse>=2.0.0",
    # Observability
    "prometheus-fastapi-instrumentator>=7.0.0",
    # Utils
    "tenacity>=9.0.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=50"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.hatch.build.targets.wheel]
packages = ["src"]